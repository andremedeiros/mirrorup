# actionlint configuration. `xcode-27` is GitHub's macOS runner with Xcode 27 (release.yml); actionlint's
# built-in label list doesn't include it yet.
self-hosted-runner:
  labels:
    - xcode-27
paths:
  .github/workflows/release.yml:
    ignore:
      # Copilot CLI's GITHUB_TOKEN scope (docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions),
      # unknown to actionlint 1.7.12.
      - 'unknown permission scope "copilot-requests"'
