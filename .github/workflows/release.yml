# Builds, signs (Developer ID), notarizes and drafts a Mirrorup release. Run it from the Actions tab
# ("Run workflow" on main); a reviewer of the `release` environment approves the run before it gets
# any signing secret, and publishes the draft after reading its notes.
# Setup (environment, certificate, profiles, notary key, secrets): docs/development.md → "Releases".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, MAJOR.MINOR[.PATCH] (e.g. 1.1.0)"
        required: true
        type: string

permissions:
  contents: write
  # Copilot CLI writes the release notes with the workflow's own token, billed to the repository
  # owner's Copilot plan.
  copilot-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    # Required reviewers and the signing secrets live in this environment; it only deploys from main.
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # macOS/extension-version.sh counts commits; a shallow clone would undercount.
          fetch-depth: 0

      - name: Check version and signing configuration
        id: version
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_PROVISIONING_PROFILE: ${{ secrets.APP_PROVISIONING_PROFILE }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases are built from main, not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::$VERSION is not MAJOR.MINOR[.PATCH]"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG already exists (as a tag or a draft release); pick another version or delete the draft"
            exit 1
          fi
          # The highest existing version tag: the new version must be above it, and release notes
          # cover what changed since.
          previous=$(git tag -l 'v*' | sort -V | tail -n 1)
          if [[ -n "$previous" && "$(printf '%s\n%s\n' "${previous#v}" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "::error::$VERSION is not higher than $previous"
            exit 1
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          missing=()
          for name in DEVELOPMENT_TEAM DEVELOPER_ID_CERTIFICATE_P12 DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APP_PROVISIONING_PROFILE NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets/variables in the release environment: ${missing[*]} (see docs/development.md)"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test
        run: make build test

      # Everything that runs code from outside this repository (XcodeGen from Homebrew, Swift package
      # resolution, the Copilot CLI from npm) runs before the signing keys are installed.
      - name: Generate the Xcode project and fetch packages
        run: |
          make project
          xcodebuild -resolvePackageDependencies -project macOS/Mirrorup.xcodeproj -scheme Mirrorup

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Write release notes
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'claude-haiku-5.5' }}
          COPILOT_CLI_VERSION: 1.0.114
        run: |
          # GitHub's generated notes (merged PRs since the previous version) are the fallback and the
          # model's input; a reviewer reads and edits the result before publishing the draft.
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          [[ -n "$PREVIOUS" ]] && args+=(-f previous_tag_name="$PREVIOUS")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" -q .body > generated.md
          cp generated.md notes.md
          # GitHub's notes stand if Copilot fails (quota, unknown model).
          range=${PREVIOUS:+$PREVIOUS..}HEAD
          {
            echo "Write the release notes for Mirrorup $VERSION, a macOS menu-bar app that turns a USB camera"
            echo "into a webcam. Readers are users deciding whether to update, not developers."
            echo "- Markdown only, no preamble or closing remarks. Start with one sentence summarising the release."
            echo "- Then short bullets grouped under '### New', '### Fixed' and '### Changed' (omit empty groups)."
            echo "- Describe what users notice, in plain words; leave out refactors, tests, CI and docs-only changes."
            echo "- Name supported cameras as the changes do; never invent features, cameras or numbers."
            echo "- End with the '**Full Changelog**' line from the generated notes, unchanged."
            echo
            echo "Generated notes (merged pull requests):"
            cat generated.md
            echo
            echo "Commits:"
            git log --no-merges --format='- %s' "$range"
          } > prompt.md
          npm install -g "@github/copilot@$COPILOT_CLI_VERSION" > /dev/null
          # No --allow-tool: the model only reads the prompt and writes text.
          if copilot -p "$(cat prompt.md)" -s --no-ask-user --no-auto-update --model "$MODEL" > copilot.md \
            && [[ -s copilot.md ]]; then
            mv copilot.md notes.md
          else
            echo "::warning::Copilot ($MODEL) failed; using GitHub's generated notes"
          fi
          cat notes.md

      - name: Install signing certificate and profile
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_PROVISIONING_PROFILE: ${{ secrets.APP_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Prepend the release keychain to the search list; the existing entries are one per word.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # The app's Developer ID profile (the extension needs none). Its name and bundle ID come
          # from the profile, so identifiers stay defined only in macOS/project.yml.
          profile="$RUNNER_TEMP/app.provisionprofile"
          printf '%s' "$APP_PROVISIONING_PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/app-profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app-profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/app-profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/app-profile.plist")
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$profile" "$profiles/$uuid.provisionprofile"
          echo "APP_PROFILE=$name" >> "$GITHUB_ENV"
          echo "APP_BUNDLE_ID=${app_id#*.}" >> "$GITHUB_ENV"
          echo "App profile: $name (${app_id#*.})"

      - name: Archive
        run: |
          xcodebuild archive \
            -project macOS/Mirrorup.xcodeproj -scheme Mirrorup -configuration Release \
            -disableAutomaticPackageResolution \
            -archivePath "$RUNNER_TEMP/Mirrorup.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            MIRRORUP_APP_PROFILE="$APP_PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export
        run: |
          python3 - "$RUNNER_TEMP/ExportOptions.plist" <<'PY'
          import os, plistlib, sys
          options = {
              "method": "developer-id",
              "signingStyle": "manual",
              "teamID": os.environ["DEVELOPMENT_TEAM"],
              "signingCertificate": "Developer ID Application",
              "provisioningProfiles": {os.environ["APP_BUNDLE_ID"]: os.environ["APP_PROFILE"]},
          }
          with open(sys.argv[1], "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mirrorup.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/Mirrorup.app"

      - name: Notarize and staple
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          app="$RUNNER_TEMP/export/Mirrorup.app"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$key"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [[ "$status" != "Accepted" ]]; then
            id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID"
            echo "::error::Notarization finished with status $status"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "Mirrorup-$VERSION.zip"

      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_VERSION: 2.10.1
          SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
          BUILD: ${{ github.run_number }}
        run: |
          # Sparkle's sign_update, from the release matching the app's Sparkle package (project.yml).
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -sSfL -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$tools/sparkle.tar.xz" -C "$tools"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          zip="Mirrorup-$VERSION.zip"
          signature=$("$tools/bin/sign_update" --ed-key-file "$RUNNER_TEMP/sparkle.key" -p "$zip")
          length=$(stat -f %z "$zip")
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$RUNNER_TEMP/export/Mirrorup.app/Contents/Info.plist")
          # One item, this release: the app's SUFeedURL resolves to the latest release's appcast.
          # Sparkle compares sparkle:version with CFBundleVersion, the workflow run number.
          python3 - "$zip" "$signature" "$length" "$minimum" <<'PY'
          import os, sys
          from email.utils import formatdate
          from xml.sax.saxutils import escape, quoteattr
          zip, signature, length, minimum = sys.argv[1:]
          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["TAG"]
          version, build = os.environ["VERSION"], os.environ["BUILD"]
          url = f"https://github.com/{repo}/releases/download/{tag}/{zip}"
          notes = f"https://github.com/{repo}/releases/tag/{tag}"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Mirrorup</title>
              <item>
                <title>{escape(f"Mirrorup {version}")}</title>
                <pubDate>{formatdate(usegmt=True)}</pubDate>
                <sparkle:version>{escape(build)}</sparkle:version>
                <sparkle:shortVersionString>{escape(version)}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>{escape(minimum)}</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>{escape(notes)}</sparkle:fullReleaseNotesLink>
                <enclosure url={quoteattr(url)} length={quoteattr(length)} type="application/octet-stream"
                           sparkle:edSignature={quoteattr(signature)}/>
              </item>
            </channel>
          </rss>
          """
          open("appcast.xml", "w").write(xml)
          PY
          cat appcast.xml
          # Fail the release rather than publish an update installed apps would reject.
          "$tools/bin/sign_update" --verify "$zip" "$signature" --ed-key-file "$RUNNER_TEMP/sparkle.key"

      - name: Draft release
        run: |
          # A draft: a reviewer reads the notes, edits them if needed and publishes it. Only then do
          # the tag and the download exist, and installed apps see the update (the appcast of the
          # latest release). --latest: never publish a release as a pre-release.
          gh release create "$TAG" "Mirrorup-$VERSION.zip" appcast.xml --draft --latest \
            --target "$GITHUB_SHA" --title "Mirrorup $VERSION" --notes-file notes.md
          url=$(gh release view "$TAG" --json url -q .url)
          echo "Draft ready for review: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP"/*.provisionprofile "$RUNNER_TEMP"/*.plist
