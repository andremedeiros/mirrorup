# Builds and tests every pull request and every push to main on the same runner as releases, so a
# failure shows up on the PR instead of in the release run. Releases require this check ("test") to
# have passed on the commit they build; "Run workflow" re-tests main when a push's run was cancelled
# or failed on a flake.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        run: make build test
